lab: 5
changes:
  heap: 空闲区链表、共享元数据节点、分割与合并
  vm: 动态页映射/释放、事务回滚、copyout、自有叶回收
  user: 模式8堆演示与错误参数，9释放后读，10释放后写，11堆执行
  monitor: heap运行真实用户演示，htest运行堆与VM行为验证，保留user/utest/proc
acceptance:
- CPUS=1/2/3/8均独立构建和实际运行
- 真实用户申请后全页零初始化、跨页写读、释放中间块、首次适配复用
- 精确hint分配产生中间分裂；归还后左右合并成整个空闲区
- 错误范围、0页、溢出、重复及部分重复释放、非堆地址和坏用户指针拒绝
- heap info以copyout传回用户结构，跨页成功；尾页错误时无部分写
- 释放后读/写分别cause13/15，堆执行cause12，内核继续工作
- 每次失败注入验证两物理池、节点余额、空闲表及已有映射不变
- 节点仓库耗尽的失败及无须新节点的操作均正确
- 退出仍有未free堆页时，所有临时资源归还
- 重复分配释放跨2MiB页表边界，无页表泄露
- 地图中的空闲区有序、不相邻、总数符合真实申请释放轨迹
- Lab4用户寄存器、中断、隔离、错误调用及Lab1至4入口保留
- Lab5复制到仓库外独立构建，不能读取其他lab源码
attribution: Agent实现与自动验证；本人理解及手动运行待真实发生后记录
